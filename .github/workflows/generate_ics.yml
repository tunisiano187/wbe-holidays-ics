name: Générer et publier ICS des congés WBE

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 1 * *'   # le 1er de chaque mois à 6h UTC (7h heure belge)
  workflow_dispatch:       # possibilité de déclenchement manuel

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run ICS generation script
      run: python generate_ics.py

    - name: Commit le fichier ICS s'il a changé
      id: commit_ics
      if: github.event_name != 'pull_request'
      env:
        ICS_FILE: conges_scolaires_wbe_futurs.ics
      run: |
        set -e
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if [ -z "$(git status --porcelain -- "$ICS_FILE")" ]; then
          echo "Fichier ICS inchangé."
          echo "changed=false" >> "$GITHUB_OUTPUT"
        else
          git add "$ICS_FILE"
          git commit -m "chore: mettre à jour le fichier ICS des congés scolaires [skip ci]"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
        fi

    # Le dépôt doit avoir au moins un commit par mois, sinon GitHub désactive
    # automatiquement le déclencheur "schedule" ci-dessus après 60 jours sans
    # activité. Comme ce job ne tourne plus qu'une fois par mois, on garantit
    # ce commit à chaque exécution : soit la vraie mise à jour ci-dessus,
    # soit ce commit vide de maintien quand le calendrier n'a pas changé.
    - name: Commit de maintien si rien n'a changé
      if: steps.commit_ics.outputs.changed == 'false' && github.event_name != 'pull_request'
      run: |
        set -e
        git commit --allow-empty -m "chore: commit de maintien mensuel pour éviter la désactivation par inactivité [skip ci]"
        git push origin HEAD:main

    - name: Horodatage de la vérification
      id: checked_at
      run: |
        echo "value=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
        echo "date_tag=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

    - name: Créer ou mettre à jour la release "latest"
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: latest
        name: Latest ICS file
        draft: false
        prerelease: false
        files: ./conges_scolaires_wbe_futurs.ics
        body: |
          Fichier ICS avec les congés scolaires futurs de la Fédération Wallonie-Bruxelles.
          Dernière vérification automatique : ${{ steps.checked_at.outputs.value }} (contenu ${{ steps.commit_ics.outputs.changed == 'true' && 'mis à jour' || 'inchangé' }} à cette occasion).

    # En plus de "latest" (pointeur stable toujours à jour), on garde une
    # release distincte par changement réel de contenu, taguée avec la date
    # au format AAAA-MM-JJ : ça donne un historique des versions qui reflète
    # les vraies mises à jour du calendrier, pas une release par run.
    - name: Créer une release datée (historique des versions)
      if: steps.commit_ics.outputs.changed == 'true' && github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.checked_at.outputs.date_tag }}
        name: ICS ${{ steps.checked_at.outputs.date_tag }}
        draft: false
        prerelease: false
        files: ./conges_scolaires_wbe_futurs.ics
        body: |
          Snapshot du fichier ICS généré le ${{ steps.checked_at.outputs.value }}, suite à un changement du calendrier des congés scolaires.
